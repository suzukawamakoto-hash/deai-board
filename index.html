<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>であい掲示板</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f7fb;
  color: #333;
}

header {
  background: linear-gradient(135deg, #ff6b9d, #8b5cf6);
  color: white;
  padding: 25px 18px;
  text-align: center;
}

header h1 {
  margin: 0;
  font-size: 26px;
}

header p {
  margin: 8px 0 0;
  font-size: 14px;
}

.container {
  max-width: 600px;
  margin: auto;
  padding: 15px;
}

.notice {
  background: white;
  border-radius: 12px;
  padding: 15px;
  margin-bottom: 15px;
  box-shadow: 0 2px 8px #ddd;
}

.notice strong {
  color: #e11d48;
}

.post-button {
  display: block;
  width: 100%;
  border: none;
  border-radius: 12px;
  padding: 15px;
  background: #ff4f87;
  color: white;
  font-size: 17px;
  font-weight: bold;
  margin-bottom: 15px;
}

.search {
  width: 100%;
  padding: 13px;
  border: 1px solid #ddd;
  border-radius: 10px;
  margin-bottom: 15px;
  font-size: 15px;
}

.post {
  background: white;
  border-radius: 14px;
  padding: 16px;
  margin-bottom: 12px;
  box-shadow: 0 2px 8px #ddd;
}

.user {
  font-weight: bold;
  color: #7c3aed;
}

.area {
  font-size: 13px;
  color: #777;
  margin-top: 4px;
}

.post h3 {
  margin: 12px 0 7px;
}

.post p {
  line-height: 1.6;
}

.actions {
  display: flex;
  gap: 8px;
}

.actions button {
  flex: 1;
  border: 1px solid #ddd;
  background: white;
  border-radius: 8px;
  padding: 9px;
}

footer {
  text-align: center;
  padding: 25px;
  color: #888;
  font-size: 12px;
}
</style>
</head>

<body>

<header>
  <h1>💗 であい掲示板</h1>
  <p>18歳以上の方の交流・出会いの掲示板</p>
</header>

<div class="container">

  <div class="notice">
    <strong>⚠️ ご利用について</strong>
    <p>
      18歳未満の方は
