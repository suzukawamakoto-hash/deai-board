const supabaseClient =

/* チャット読み込み */  
  
async function loadMessages(){  
  
 if(!chatPartner)return;  
  
  
 const roomId=  
  makeRoomId(  
   myUserId,  
   chatPartner.userId  
  );  
  
  
 const {data,error}=  
 await supabaseClient  
 .from("messages")  
 .select("*")  
 .eq("room_id",roomId)  
 .order("created_at",{ascending:true});  
  
  
 if(error){  
  
  console.error(error);  
  
  document.getElementById(  
   "chatMessages"  
  ).innerHTML=  
  
   `<div class="chat-empty">

   </div>`;  
  
  return;  
  
 }  
  
  
 renderMessages(data || []);  
  
}  
  
  
/* 2人専用ルームID */

 return [a,b]  
  .sort()  
  .join("__");  
  
}

/* いいね */  
  
async function likePost(id){  
  
 const post=  
  posts.find(p=>p.id===id);  
  
 if(!post)return;  
  
  
 let likedBy=  
  Array.isArray(post.likedBy)  
  ? [...post.likedBy]  
  : [];  
  
  
 const index=  
  likedBy.indexOf(myUserId);  
  
  
 let likes=  
  Number(post.likes||0);  
  
  
 if(index>=0){  
  
  likedBy.splice(index,1);  
  
  likes=Math.max(  
   0,  
   likes-1  
  );  
  
 }else{  
  
  likedBy.push(myUserId);  
  
  likes++;  
  
 }  
  
  
 const {error}=  
 await supabaseClient  
 .from("posts")  
 .update({  
  likes,  
  liked_by:likedBy  
 })  
 .eq("id",id);  
  
  
 if(error){  
  
  alert(  
   "いいねを保存できませんでした。\n"+  
   error.message  
  );  
  
  return;  
  
 }  
  
  
 await loadPosts();  
  
}

    gender,  
  
    prefecture,  
  
    city,

    message,  
  
    image_url:imageUrl,  
  
    likes:0,

    comments:[]  
  
   };

    .from("posts")

   if(error)throw error;

/* 画像 */  
  
function previewImage(event){  
  
 const file=  
  event.target.files[0];  
  
 const preview=  
  document.getElementById(  
   "imagePreview"  
  );  
  
  
 if(!file){  
  
  preview.style.display="none";

 }  
  
  
 resizeImageToBase64(file)  
 .then(base64=>{

  preview.style.display="block";  
  
 })  
 .catch(e=>  
  alert(e.message)  
 );

function resizeImageToBase64(file){  
  
 return new Promise(  
  (resolve,reject)=>{  
  
   if(  
    !file.type.startsWith("image/")  
   ){  
  
    return reject(  
     new Error(  
      "画像ファイルを選択してください。"  
     )  
    );  
  
   }  
  
  
   const reader=  
    new FileReader();  
  
  
   reader.onerror=()=>  
    reject(  
     new Error(  
      "画像を読み込めませんでした。"  
     )  
    );  
  
  
   reader.onload=e=>{  
  
    const img=  
     new Image();  
  
  
    img.onload=()=>{  
  
     const maxWidth=900;  
  
     let width=img.width;  
     let height=img.height;  
  
  
     if(width>maxWidth){  
  
      height=  
       height*  
       maxWidth/  
       width;  
  
      width=maxWidth;  
  
     }  
  
  
     const canvas=  
      document.createElement(  
       "canvas"  
      );  
  
  
     canvas.width=width;  
     canvas.height=height;  
  
  
     canvas  
     .getContext("2d")  
     .drawImage(  
      img,  
      0,  
      0,  
      width,  
      height  
     );  
  
  
     resolve(  
      canvas.toDataURL(  
       "image/jpeg",  
       .7  
      )  
     );  
  
    };  
  
  
    img.onerror=()=>  
     reject(  
      new Error(  
       "画像を読み込めませんでした。"  
      )  
     );  
  
  
    img.src=e.target.result;  
  
   };  
  
  
   reader.readAsDataURL(file);  
  
  }  
 );  
  
}  
  
  
/* HTMLエスケープ */  
  
function escapeHTML(value){  
  
 return String(value ?? "")  
  .replace(/&/g,"&amp;")  
  .replace(/</g,"&lt;")  
  .replace(/>/g,"&gt;")  
  .replace(/"/g,"&quot;")  
  .replace(/'/g,"&#039;");  
  
}
