<!DOCTYPE html>  <html lang="ja">  
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">  <title>であい掲示板</title>  <style>  
* {  
  box-sizing: border-box;  
}  
  
body {

.comment-form button {

}  
  
.empty {

}  
  
.modal {

  z-index: 1000;

  top: 0;

label {

input,  
select,  
textarea {

footer {

@media (max-width: 480px) {

  }  
  
  .actions button {

  }  
  
  .search-type {  
    width: 90px;  
  }  
}

<form onsubmit="savePost(event)">

  <label>市区町村</label>

  </div>  </div>  <script>  
  
/* =========================  
   自分の端末を識別  
========================= */  
  
let myUserId = localStorage.getItem("deaiUserId");  
  
if (!myUserId) {  
  myUserId =  
    "user_" +  
    Date.now() +  
    "_" +  
    Math.random().toString(36).substring(2);  
  
  localStorage.setItem("deaiUserId", myUserId);  
}  
  
  
/* =========================  
   初期投稿  
========================= */  
  
const defaultPosts = [  
  
  {  
    id: 1,  
    userId: "sample1",  
    name: "まこ",  
    age: 20,  
    gender: "女性",  
    prefecture: "東京都",  
    city: "新宿区",  
    title: "気軽に話せる人募集",  
    message: "趣味の話など、気軽に話せる人を探しています！",  
    image: "",  
    likes: 3,  
    likedBy: [],  
    comments: [],  
    date: "2026/10/02"  
  },  
  
  {  
    id: 2,  
    userId: "sample2",  
    name: "ゆう",  
    age: 24,  
    gender: "男性",  
    prefecture: "大阪府",  
    city: "大阪市",  
    title: "仲良くなれる人募集",  
    message: "まずは掲示板でゆっくりお話しできたら嬉しいです。",  
    image: "",  
    likes: 1,  
    likedBy: [],  
    comments: [],  
    date: "2026/10/02"  
  }  
  
];  
  
  
/* =========================  
   投稿データ  
========================= */  
  
let posts =  
  JSON.parse(localStorage.getItem("deaiPosts"))  
  || defaultPosts;  
  
  
/* =========================  
   編集中ID  
========================= */  
  
let editingPostId = null;  
  
  
/* =========================  
   読み込み  
========================= */  
  
window.onload = function() {  
  
  const ageConfirmed =  
    localStorage.getItem("ageConfirmed");  
  
  if (ageConfirmed !== "yes") {  
    document.getElementById("ageGate").style.display = "flex";  
  }  
  
  renderPosts();  
  
};  
  
  
/* =========================  
   年齢確認  
========================= */  
  
function confirmAge() {  
  
  localStorage.setItem(  
    "ageConfirmed",  
    "yes"  
  );  
  
  document.getElementById("ageGate").style.display =  
    "none";  
}  
  
  
function denyAge() {  
  
  document.body.innerHTML = `  
  
    <div style="  
      text-align:center;  
      padding:60px 20px;  
      font-family:Arial,sans-serif;  
    ">  
  
      <h2>ご利用いただけません</h2>  
  
      <p>  
        このサイトは18歳以上の方を対象としています。  
      </p>  
  
    </div>  
  
  `;  
  
}  
  
  
/* =========================  
   投稿表示  
========================= */  
  
function renderPosts(keyword = "") {  
  
  const container =  
    document.getElementById("posts");  
  
  container.innerHTML = "";  
  
  const type =  
    document.getElementById("searchType").value;  
  
  const search =  
    keyword.trim().toLowerCase();  
  
  const filtered =  
    posts.filter(post => {  
  
      if (!search) return true;  
  
      let target = "";  
  
      if (type === "name") {  
        target = post.name;  
      }  
  
      else if (type === "area") {  
        target = post.prefecture;  
      }  
  
      else if (type === "city") {  
        target = post.city;  
      }  
  
      else if (type === "gender") {  
        target = post.gender;  
      }  
  
      else {  
        target = `  
          ${post.name}  
          ${post.gender}  
          ${post.prefecture}  
          ${post.city}  
          ${post.title}  
          ${post.message}  
        `;  
      }  
  
      return target  
        .toLowerCase()  
        .includes(search);  
  
    });  
  
  
  if (filtered.length === 0) {  
  
    container.innerHTML = `  
      <div class="empty">  
        投稿が見つかりませんでした。  
      </div>  
    `;  
  
    return;  
  }  
  
  
  filtered.forEach(post => {  
  
    const article =  
      document.createElement("div");  
  
    article.className = "post";  
  
  
    const liked =  
      post.likedBy &&  
      post.likedBy.includes(myUserId);  
  
  
    let commentsHTML = "";  
  
    if (post.comments && post.comments.length > 0) {  
  
      commentsHTML = post.comments.map(comment => `  
  
        <div class="comment">  
  
          <span class="comment-name">  
            ${escapeHTML(comment.name)}  
          </span>  
  
          <span class="comment-date">  
            ${escapeHTML(comment.date)}  
          </span>  
  
          <div>  
            ${escapeHTML(comment.text)}  
          </div>  
  
        </div>  
  
      `).join("");  
  
    }  
  
  
    article.innerHTML = `  
  
      <div class="user-line">  
  
        <div class="user">  
          👤 ${escapeHTML(post.name)}  
        </div>  
  
        <div class="gender">  
          ${escapeHTML(post.gender)}  
        </div>  
  
      </div>  
  
  
      <div class="profile-info">  
  
        🎂 ${post.age}歳  
  
        ・  
  
        📍 ${escapeHTML(post.prefecture)}  
        ${escapeHTML(post.city)}  
  
      </div>  
  
  
      <h3>  
        ${escapeHTML(post.title)}  
      </h3>  
  
  
      <p>  
        ${escapeHTML(post.message)}  
      </p>  
  
  
      ${  
        post.image  
        ?  
        `<img  
          class="post-image"  
          src="${post.image}"  
          alt="投稿画像"  
        >`  
        :  
        ""  
      }  
  
  
      <div class="date">  
        投稿日：${escapeHTML(post.date)}  
      </div>  
  
  
      <div class="actions">  
  
        <button  
          class="like-button"  
          onclick="likePost(${post.id})">  
  
          ${liked ? "💗" : "❤️"}  
          ${post.likes}  
  
        </button>  
  
  
        <button  
          class="comment-button"  
          onclick="focusComment(${post.id})">  
  
          💬 コメント  
  
        </button>  
  
  
        ${  
          post.userId === myUserId  
          ?  
          `  
          <button  
            class="edit-button"  
            onclick="editPost(${post.id})">  
  
            ✏️ 編集  
  
          </button>  
  
          <button  
            class="delete-button"  
            onclick="deletePost(${post.id})">  
  
            🗑️ 削除  
  
          </button>  
          `  
          :  
          ""  
        }  
  
  
        <button  
          class="report-button"  
          onclick="reportPost(${post.id})">  
  
          🚩 通報  
  
        </button>  
  
      </div>  
  
  
      <div class="comments">  
  
        ${commentsHTML}  
  
  
        <div class="comment-form">  
  
          <input  
            id="comment-${post.id}"  
            type="text"  
            maxlength="200"  
            placeholder="コメントを書く..."  
          >  
  
          <button  
            onclick="addComment(${post.id})">  
  
            送信  
  
          </button>  
  
        </div>  
  
      </div>  
  
    `;  
  
  
    container.appendChild(article);  
  
  });  
  
}  
  
  
/* =========================  
   投稿保存  
========================= */  
  
function savePost(event) {  
  
  event.preventDefault();  
  
  
  const name =  
    document.getElementById("name").value.trim();  
  
  const age =  
    Number(document.getElementById("age").value);  
  
  const gender =  
    document.getElementById("gender").value;  
  
  const prefecture =  
    document.getElementById("prefecture").value;  
  
  const city =  
    document.getElementById("city").value.trim();  
  
  const title =  
    document.getElementById("title").value.trim();  
  
  const message =  
    document.getElementById("message").value.trim();  
  
  
  if (age < 18) {  
  
    alert("18歳以上の方のみ投稿できます。");  
  
    return;  
  
  }  
  
  
  if (!name || !gender || !prefecture || !city ||  
      !title || !message) {  
  
    alert("入力されていない項目があります。");  
  
    return;  
  
  }  
  
  
  const imageInput =  
    document.getElementById("image");  
  
  
  if (editingPostId !== null) {  
  
    const post =  
      posts.find(p => p.id === editingPostId);  
  
    if (!post) return;  
  
  
    if (post.userId !== myUserId) {  
  
      alert("この投稿は編集できません。");  
  
      return;  
  
    }  
  
  
    post.name = name;  
    post.age = age;  
    post.gender = gender;  
    post.prefecture = prefecture;  
    post.city = city;  
    post.title = title;  
    post.message = message;  
  
  
    if (imageInput.files.length > 0) {  
  
      resizeImage(  
        imageInput.files[0],  
        function(base64) {  
  
          post.image = base64;  
  
          saveData();  
  
          closePostModal();  
  
          renderPosts();  
  
          alert("投稿を編集しました。");  
  
        }  
      );  
  
      return;  
  
    }  
  
  
    saveData();  
  
    closePostModal();  
  
    renderPosts();  
  
    alert("投稿を編集しました。");  
  
    return;  
  
  }  
  
  
  const newPost = {  
  
    id: Date.now(),  
  
    userId: myUserId,  
  
    name: name,  
  
    age: age,  
  
    gender: gender,  
  
    prefecture: prefecture,  
  
    city: city,  
  
    title: title,  
  
    message: message,  
  
    image: "",  
  
    likes: 0,  
  
    likedBy: [],  
  
    comments: [],  
  
    date:  
      new Date().toLocaleDateString("ja-JP")  
  
  };  
  
  
  if (imageInput.files.length > 0) {  
  
    resizeImage(  
      imageInput.files[0],  
      function(base64) {  
  
        newPost.image = base64;  
  
        posts.unshift(newPost);  
  
        saveData();  
  
        closePostModal();  
  
        renderPosts();  
  
        alert("投稿しました！");  
  
      }  
    );  
  
  }  
  
  else {  
  
    posts.unshift(newPost);  
  
    saveData();  
  
    closePostModal();  
  
    renderPosts();  
  
    alert("投稿しました！");  
  
  }  
  
}  
  
  
/* =========================  
   データ保存  
========================= */  
  
function saveData() {  
  
  try {  
  
    localStorage.setItem(  
      "deaiPosts",  
      JSON.stringify(posts)  
    );  
  
  }  
  
  catch (error) {  
  
    alert(  
      "保存容量を超えました。\n" +  
      "画像を小さくするか、古い投稿を削除してください。"  
    );  
  
  }  
  
}  
  
  
/* =========================  
   画像圧縮  
========================= */  
  
function resizeImage(file, callback) {  
  
  if (!file.type.startsWith("image/")) {  
  
    alert("画像ファイルを選択してください。");  
  
    return;  
  
  }  
  
  
  const reader =  
    new FileReader();  
  
  
  reader.onload = function(event) {  
  
    const img =  
      new Image();  
  
  
    img.onload = function() {  
  
      const maxWidth = 900;  
  
      let width = img.width;  
      let height = img.height;  
  
  
      if (width > maxWidth) {  
  
        height =  
          height * maxWidth / width;  
  
        width = maxWidth;  
  
      }  
  
  
      const canvas =  
        document.createElement("canvas");  
  
      canvas.width = width;  
      canvas.height = height;  
  
  
      const ctx =  
        canvas.getContext("2d");  
  
      ctx.drawImage(  
        img,  
        0,  
        0,  
        width,  
        height  
      );  
  
  
      const base64 =  
        canvas.toDataURL(  
          "image/jpeg",  
          0.75  
        );  
  
  
      callback(base64);  
  
    };  
  
  
    img.src = event.target.result;  
  
  };  
  
  
  reader.readAsDataURL(file);  
  
}  
  
  
/* =========================  
   画像プレビュー  
========================= */  
  
function previewImage(event) {  
  
  const file =  
    event.target.files[0];  
  
  const preview =  
    document.getElementById("imagePreview");  
  
  
  if (!file) {  
  
    preview.style.display = "none";  
  
    return;  
  
  }  
  
  
  resizeImage(  
    file,  
    function(base64) {  
  
      preview.src = base64;  
  
      preview.style.display = "block";  
  
    }  
  );  
  
}  
  
  
/* =========================  
   いいね  
========================= */  
  
function likePost(id) {  
  
  const post =  
    posts.find(p => p.id === id);  
  
  if (!post) return;  
  
  
  if (!post.likedBy) {  
    post.likedBy = [];  
  }  
  
  
  const index =  
    post.likedBy.indexOf(myUserId);  
  
  
  if (index >= 0) {  
  
    post.likedBy.splice(index, 1);  
  
    post.likes =  
      Math.max(0, post.likes - 1);  
  
  }  
  
  else {  
  
    post.likedBy.push(myUserId);  
  
    post.likes++;  
  
  }  
  
  
  saveData();  
  
  searchPosts();  
  
}  
  
  
/* =========================  
   コメント  
========================= */  
  
function addComment(id) {  
  
  const input =  
    document.getElementById(  
      "comment-" + id  
    );  
  
  
  if (!input) return;  
  
  
  const text =  
    input.value.trim();  
  
  
  if (!text) {  
  
    alert("コメントを入力してください。");  
  
    return;  
  
  }  
  
  
  const post =  
    posts.find(p => p.id === id);  
  
  if (!post) return;  
  
  
  if (!post.comments) {  
    post.comments = [];  
  }  
  
  
  post.comments.push({  
  
    id: Date.now(),  
  
    name: "匿名",  
  
    text: text,  
  
    date:  
      new Date().toLocaleDateString("ja-JP")  
  
  });  
  
  
  saveData();  
  
  searchPosts();  
  
}  
  
  
function focusComment(id) {  
  
  const input =  
    document.getElementById(  
      "comment-" + id  
    );  
  
  if (input) {  
  
    input.focus();  
  
    input.scrollIntoView({  
      behavior: "smooth",  
      block: "center"  
    });  
  
  }  
  
}  
  
  
/* =========================  
   投稿編集  
========================= */  
  
function editPost(id) {  
  
  const post =  
    posts.find(p => p.id === id);  
  
  if (!post) return;  
  
  
  if (post.userId !== myUserId) {  
  
    alert("この投稿は編集できません。");  
  
    return;  
  
  }  
  
  
  editingPostId = id;  
  
  
  document.getElementById("modalTitle").textContent =  
    "✏️ 投稿を編集";  
  
  
  document.getElementById("name").value =  
    post.name;  
  
  document.getElementById("age").value =  
    post.age;  
  
  document.getElementById("gender").value =  
    post.gender;  
  
  document.getElementById("prefecture").value =  
    post.prefecture;  
  
  document.getElementById("city").value =  
    post.city;  
  
  document.getElementById("title").value =  
    post.title;  
  
  document.getElementById("message").value =  
    post.message;  
  
  
  const preview =  
    document.getElementById("imagePreview");  
  
  
  if (post.image) {  
  
    preview.src = post.image;  
  
    preview.style.display = "block";  
  
  }  
  
  else {  
  
    preview.style.display = "none";  
  
  }  
  
  
  document.getElementById("postModal").style.display =  
    "block";  
  
}  
  
  
/* =========================  
   投稿削除  
========================= */  
  
function deletePost(id) {  
  
  const post =  
    posts.find(p => p.id === id);  
  
  if (!post) return;  
  
  
  if (post.userId !== myUserId) {  
  
    alert("この投稿は削除できません。");  
  
    return;  
  
  }  
  
  
  if (!confirm("この投稿を削除しますか？")) {  
    return;  
  }  
  
  
  posts =  
    posts.filter(  
      post => post.id !== id  
    );  
  
  
  saveData();  
  
  searchPosts();  
  
}  
  
  
/* =========================  
   通報  
========================= */  
  
function reportPost(id) {  
  
  const post =  
    posts.find(p => p.id === id);  
  
  if (!post) return;  
  
  
  const reason =  
    prompt(  
      "通報理由を入力してください。\n\n" +  
      "例：迷惑行為、不適切な内容、危険な勧誘など"  
    );  
  
  
  if (!reason) return;  
  
  
  alert(  
    "通報を受け付けました。\n\n" +  
    "理由：" + reason +  
    "\n\n管理者による確認が必要です。"  
  );  
  
}  
  
  
/* =========================  
   検索  
========================= */  
  
function searchPosts() {  
  
  const keyword =  
    document.getElementById(  
      "searchInput"  
    ).value;  
  
  renderPosts(keyword);  
  
}  
  
  
/* =========================  
   投稿フォームを開く  
========================= */  
  
function openPostModal() {  
  
  editingPostId = null;  
  
  
  document.getElementById("modalTitle").textContent =  
    "📝 新しく投稿";  
  
  
  document.querySelector(  
    "#postModal form"  
  ).reset();  
  
  
  document.getElementById("imagePreview").style.display =  
    "none";  
  
  
  document.getElementById("postModal").style.display =  
    "block";  
  
}  
  
  
/* =========================  
   投稿フォームを閉じる  
========================= */  
  
function closePostModal() {  
  
  document.getElementById("postModal").style.display =  
    "none";  
  
  editingPostId = null;  
  
}  
  
  
/* =========================  
   HTMLエスケープ  
========================= */  
  
function escapeHTML(value) {  
  
  return String(value)  
  
    .replace(/&/g, "&amp;")  
  
    .replace(/</g, "&lt;")  
  
    .replace(/>/g, "&gt;")  
  
    .replace(/"/g, "&quot;")  
  
    .replace(/'/g, "&#039;");  
  
}  
  
  
/* =========================  
   モーダル外クリック  
========================= */  
  
window.onclick = function(event) {  
  
  const modal =  
    document.getElementById("postModal");  
  
  if (event.target === modal) {  
  
    closePostModal();  
  
  }  
  
};  
  
</script>  </body>
